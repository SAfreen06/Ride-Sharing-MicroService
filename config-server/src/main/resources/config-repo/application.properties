# Shared defaults, applied to every client that pulls config from this server.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
management.endpoints.web.exposure.include=health,info

# Shared JWT signing secret: the Gateway validates tokens with this,
# and every service that issues/checks tokens must use the same one.
# HS256 needs a secret >= 256 bits; this is a dev-only placeholder, not for prod use.
jwt.secret=7f2c9a1e4b8d3f6a0c5e9b2d7f4a1c8e6b3d9f0a2c5e8b1d4f7a0c3e6b9d2f5a
